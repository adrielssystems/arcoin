server {
    listen 80;
    server_name arcoinca.com www.arcoinca.com localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # 1. Bloqueo total de archivos y directorios ocultos (.env, .git, .aws, .ssh, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 2. Bloqueo de extensiones sensibles y archivos de backup (.env*, .bak, .old, .sql, .yml, .yaml, .ini, .log, etc.)
    location ~* \.(env.*|bak|old|orig|save|swp|temp|tmp|sql|tar|gz|zip|yml|yaml|ini|conf|log)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 3. Bloqueo de sondas y exploits comunes (WordPress, PHP, ASP, scripts)
    location ~* (wp-admin|wp-content|wp-includes|xmlrpc\.php|wlwmanifest|\.php|\.asp|\.aspx|\.cgi|\.jsp)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Cache de recursos estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # SPA Fallback (rutas válidas de la aplicación)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
