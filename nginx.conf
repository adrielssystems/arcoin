server {
    listen 80;
    server_name arcoinca.com www.arcoinca.com localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # 1. Bloqueo inmediato de Scanners y Bots Abusivos por User-Agent
    if ($http_user_agent ~* (CoinCreator|FossickBot|ShinkiHPBot|CMS-Checker|aiohttp|HeadlessChrome|masscan|zgrab|Nmap)) {
        return 403;
    }

    # 2. Favicons y Robots legítimos (evita registrar [error] en disco)
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /favicon.png {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }

    # 3. Bloqueo total de archivos y carpetas ocultas (.env, .git, .aws, .ssh, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 4. Bloqueo de sondas a archivos de configuración, entorno y AI (/env, /config, .md, .json, .yml)
    location ~* (^/env|^/environment|^/api/|config\.js|env\.js|\.md$|\.markdown$|\.env|\.bak$|\.old$|\.sql$|\.yml$|\.yaml$) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 5. Bloqueo de sondas y exploits de WordPress / PHP / ASP
    location ~* (wp-admin|wp-content|wp-includes|xmlrpc\.php|wlwmanifest|\.php|\.asp|\.aspx|\.cgi|\.jsp) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 6. Cache de recursos estáticos legítimos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # 7. Fallback SPA para navegación web
    location / {
        try_files $uri $uri/ /index.html;
    }
}
